name: release

# Publishing is driven by a tag, so the version that ships is always a version
# that exists in git history. A manual `npm publish` from a laptop is how
# packages end up shipping uncommitted work.
#
# The same tarball goes to two registries. npmjs.com is the one users install
# from; GitHub Packages exists so the repository's own Packages panel reflects
# what has shipped. They are separate jobs rather than one, so that a failure in
# the second can be re-run on its own — `gh run rerun --failed`. Combined, a
# retry would attempt to republish a version npm has already accepted, and npm
# refuses that.
on:
  push:
    tags: ["v*"]

  # Lets an already-tagged version be pushed to GitHub Packages without
  # re-releasing it to npm. Needed once to backfill anything tagged before this
  # job existed, and useful whenever only the second registry fails.
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to publish to GitHub Packages (e.g. v0.2.0)"
        required: true

permissions:
  contents: read

jobs:
  # Builds every template from the tagged commit before anything publishes.
  #
  # `npm test` alone is not a publish gate for this package. What it ships is a
  # scaffolder, so the thing that has to work is the project that comes out of
  # it — and the last two release-worthy bugs (a worker no bundler emitted, a
  # zero-length tuple that would not typecheck) were both invisible to the
  # suite and obvious the moment a generated project was built.
  templates:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [next, nuxt, astro, html]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node ci/build-template.mjs ${{ matrix.template }}

  npm:
    # Only on a real tag push. A manual run is for backfilling the GitHub
    # Packages side, and npm will not accept a version it already has.
    if: github.event_name == 'push'
    needs: templates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # The suite gates the release. A tag should not be able to ship something
      # that does not pass on a clean checkout.
      - run: npm test

      - name: Check the tag matches the version in package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json $pkg" >&2
            exit 1
          fi

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-packages:
    needs: [npm]
    # Runs after a successful npm publish, or on its own when dispatched by
    # hand. `always()` is what lets the second case through, since `needs` is
    # otherwise skipped when the job it depends on did not run.
    if: |
      always() &&
      (needs.npm.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      # Deliberately no `npm ci`. With the registry pointed at GitHub Packages
      # an install would try to resolve next, react and the rest from there and
      # fail. `npm publish` packs straight from the working tree, and this
      # package has no prepublish script that would need dependencies.
      #
      # No --provenance either: that is attested against npmjs.com, and the npm
      # job above already produces it. This is the same tarball, published a
      # second time so the repository's Packages panel is not empty.
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Turn the tag into a GitHub release.
  #
  # Added after v0.3.0 and v0.4.0 both shipped to npm while the releases page
  # still read v0.2.0. The tags were pushed and the packages published; nothing
  # in this workflow ever created a release, so the one page most people look at
  # was two versions stale.
  #
  # Last, and gated on the npm job, so a release only ever describes something
  # that actually published. A release pointing at a version npm rejected is
  # worse than no release.
  github-release:
    needs: [npm]
    if: github.event_name == 'push' && needs.npm.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # creating a release is a write to the repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Notes come from CHANGELOG.md rather than from generated commit titles:
      # the changelog is written for someone deciding whether to upgrade, and a
      # list of commit subjects is not. Missing or empty section exits non-zero
      # rather than publishing a blank release body, which would read as
      # "nothing changed" instead of "nobody wrote it down".
      - name: Take the notes from the changelog
        run: node ci/changelog-notes.mjs "${GITHUB_REF_NAME}" > /tmp/notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/notes.md \
            --verify-tag
